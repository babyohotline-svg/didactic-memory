<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCP FOUNDATION</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0a0a0a; color: #c8c8c8; font-family: 'Courier New', monospace; min-height: 100vh; overflow-x: hidden; }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(139,0,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139,0,0,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -2;
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.6) 100%);
    z-index: -1;
    pointer-events: none;
  }

  #loader {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.8s;
  }

  .loader-emblem {
    width: 120px;
    height: 120px;
    margin-bottom: 40px;
    animation: pulseGlow 2.5s infinite;
  }
  .loader-emblem svg { width: 100%; height: 100%; }

  @keyframes pulseGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(139,0,0,0.5)); }
    50% { filter: drop-shadow(0 0 30px rgba(139,0,0,0.9)); }
  }

  .load-text {
    color: #555;
    font-size: 11px;
    letter-spacing: 3px;
    line-height: 2.2;
    text-align: center;
    min-height: 100px;
  }
  .load-text span { color: #8B0000; }
  .cursor {
    display: inline-block;
    width: 8px;
    height: 13px;
    background: #8B0000;
    animation: blink 1s infinite;
    vertical-align: middle;
    margin-left: 2px;
  }
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  .screen {
    display: none;
    min-height: 100vh;
    padding: 60px 24px;
    max-width: 720px;
    margin: 0 auto;
    animation: fadeIn 0.6s ease;
  }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #login {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #login.active { display: flex; }

  .login-emblem {
    width: 100px;
    height: 100px;
    margin-bottom: 32px;
    animation: pulseGlow 3s infinite;
  }
  .login-emblem svg { width: 100%; height: 100%; }

  .login-title { color: #8B0000; font-size: 12px; letter-spacing: 6px; margin-bottom: 12px; }
  .login-sub { color: #d4d4d4; font-size: 18px; letter-spacing: 3px; margin-bottom: 48px; }

  .code-input {
    width: 100%;
    max-width: 340px;
    background: transparent;
    border: none;
    border-bottom: 1px solid #333;
    color: #d4d4d4;
    font-family: 'Courier New', monospace;
    font-size: 22px;
    padding: 14px 0;
    letter-spacing: 6px;
    text-align: center;
    outline: none;
    transition: border-color 0.3s;
  }
  .code-input:focus { border-color: #8B0000; box-shadow: 0 4px 12px -8px #8B0000; }
  .code-input::placeholder { color: #2a2a2a; letter-spacing: 4px; }

  .login-btn {
    margin-top: 32px;
    padding: 14px 48px;
    background: transparent;
    border: 1px solid #8B0000;
    color: #8B0000;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 4px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .login-btn:hover { background: #8B0000; color: #0a0a0a; box-shadow: 0 0 24px rgba(139,0,0,0.6); transform: translateY(-1px); }

  .login-footer { margin-top: 48px; color: #1f1f1f; font-size: 10px; letter-spacing: 3px; }

  .error-msg { color: #8B0000; font-size: 11px; letter-spacing: 2px; margin-top: 16px; min-height: 16px; animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #1f1f1f;
    padding-bottom: 20px;
    margin-bottom: 40px;
    position: relative;
  }
  .topbar::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 60px;
    height: 1px;
    background: #8B0000;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar-emblem { width: 38px; height: 38px; flex-shrink: 0; }
  .topbar-emblem svg { width: 100%; height: 100%; }
  .topbar-title { color: #d4d4d4; font-size: 12px; letter-spacing: 3px; line-height: 1.4; }
  .topbar-status { color: #8B0000; font-size: 10px; letter-spacing: 2px; animation: blink 2s infinite; }

  .menu { display: flex; flex-direction: column; gap: 2px; }
  .menu-item {
    padding: 18px 24px;
    border: 1px solid #1a1a1a;
    color: #777;
    font-size: 12px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .menu-item::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #8B0000;
    transform: scaleY(0);
    transition: transform 0.25s;
  }
  .menu-item:hover { border-color: #3a1010; color: #d4d4d4; background: rgba(139,0,0,0.04); padding-left: 30px; }
  .menu-item:hover::before { transform: scaleY(1); }
  .menu-item .arrow { color: #333; transition: all 0.25s; }
  .menu-item:hover .arrow { color: #8B0000; transform: translateX(4px); }
  .menu-item.protocol { border-color: #3a1010; color: #8B0000; }
  .menu-item.protocol .arrow { color: #8B0000; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 500;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    max-width: 480px;
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #8B0000;
    padding: 40px 32px;
    position: relative;
    animation: modalIn 0.4s ease;
    box-shadow: 0 0 60px rgba(139,0,0,0.2);
  }
  .modal::before, .modal::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    border: 1px solid #8B0000;
  }
  .modal::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .modal::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-title { color: #8B0000; font-size: 12px; letter-spacing: 4px; margin-bottom: 24px; text-align: center; }
  .modal-text { color: #aaa; font-size: 13px; line-height: 1.9; margin-bottom: 32px; text-align: center; }
  .modal-btn {
    display: block;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid #8B0000;
    color: #8B0000;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .modal-btn:hover { background: #8B0000; color: #0a0a0a; box-shadow: 0 0 24px rgba(139,0,0,0.6); }

  .protocol-head { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
  .protocol-emblem { width: 44px; height: 44px; flex-shrink: 0; }
  .protocol-emblem svg { width: 100%; height: 100%; }
  .protocol-header { color: #8B0000; font-size: 11px; letter-spacing: 4px; margin-bottom: 4px; }
  .protocol-title { color: #d4d4d4; font-size: 18px; letter-spacing: 2px; }
  .protocol-divider { height: 1px; background: linear-gradient(90deg, #8B0000, transparent); margin: 20px 0 40px; }

  .day {
    border: 1px solid #1a1a1a;
    padding: 24px;
    margin-bottom: 16px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }
  .day.locked { opacity: 0.4; cursor: not-allowed; }
  .day.available { border-color: #8B0000; }
  .day.available:hover { background: rgba(139,0,0,0.05); transform: translateX(4px); }
  .day.open { border-color: #8B0000; background: rgba(139,0,0,0.03); }
  .day.open::before {
    content: '';
    position: absolute;
    left: -1px;
    top: -1px;
    bottom: -1px;
    width: 3px;
    background: #8B0000;
  }
  .day-head { display: flex; justify-content: space-between; align-items: center; }
  .day-num { color: #d4d4d4; font-size: 13px; letter-spacing: 3px; }
  .day-status { font-size: 10px; letter-spacing: 2px; }
  .day-status.done { color: #4a7a4a; }
  .day-status.wait { color: #8B0000; animation: blink 2s infinite; }
  .day-status.lock { color: #333; }
  .day-timer { color: #555; font-size: 11px; letter-spacing: 2px; margin-top: 8px; }
  .day-body { margin-top: 20px; padding-top: 20px; border-top: 1px solid #1a1a1a; display: none; }
  .day.open .day-body { display: block; animation: fadeIn 0.4s ease; }
  .day-text { color: #aaa; font-size: 13px; line-height: 1.9; margin-bottom: 20px; white-space: pre-line; }
  .day-code-input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid #333;
    color: #d4d4d4;
    font-family: 'Courier New', monospace;
    font-size: 16px;
    padding: 10px 0;
    letter-spacing: 4px;
    outline: none;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }
  .day-code-input:focus { border-color: #8B0000; }
  .day-btn {
    padding: 10px 28px;
    background: transparent;
    border: 1px solid #8B0000;
    color: #8B0000;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .day-btn:hover { background: #8B0000; color: #0a0a0a; box-shadow: 0 0 16px rgba(139,0,0,0.5); }
  .day-result { margin-top: 16px; font-size: 12px; letter-spacing: 2px; min-height: 18px; }
  .day-result.ok { color: #4a7a4a; }
  .day-result.err { color: #8B0000; animation: shake 0.4s; }

  .back-link {
    display: inline-block;
    margin-top: 32px;
    color: #555;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .back-link:hover { color: #8B0000; transform: translateX(-4px); }

  .final-message {
    border: 1px solid #8B0000;
    padding: 40px 32px;
    text-align: center;
    margin-top: 24px;
    position: relative;
    background: rgba(139,0,0,0.04);
    box-shadow: inset 0 0 40px rgba(139,0,0,0.1);
  }
  .final-message::before, .final-message::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid #8B0000;
  }
  .final-message::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .final-message::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .final-message .big {
    color: #8B0000;
    font-size: 22px;
    letter-spacing: 6px;
    margin: 20px 0;
    text-shadow: 0 0 20px rgba(139,0,0,0.5);
  }

  @media (max-width: 500px) {
    .screen { padding: 40px 16px; }
    .topbar-title { font-size: 10px; letter-spacing: 2px; }
    .topbar-status { display: none; }
    .login-sub { font-size: 15px; letter-spacing: 2px; }
  }
</style>
</head>
<body>

<!-- НАСТОЯЩИЙ ЗНАК SCP FOUNDATION -->
<svg style="display:none">
  <symbol id="scp-logo" viewBox="0 0 200 200">
    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square">
      <!-- Внешнее кольцо с тремя разрывами -->
      <path d="M 100 15
               A 85 85 0 0 1 173.6 57.5
               L 190 50
               L 190 90
               L 155 82
               A 85 85 0 0 1 155 140
               L 173.6 142.5
               L 148 175
               L 120 150
               A 85 85 0 0 1 80 150
               L 52 175
               L 26.4 142.5
               L 45 140
               A 85 85 0 0 1 45 82
               L 10 90
               L 10 50
               L 26.4 57.5
               A 85 85 0 0 1 100 15 Z"
            stroke="#8B0000" fill="none" stroke-width="5"/>

      <!-- Внутреннее кольцо -->
      <circle cx="100" cy="100" r="38" stroke="#8B0000" stroke-width="5"/>

      <!-- Три стрелки к центру -->
      <line x1="100" y1="30" x2="100" y2="75" stroke="#8B0000" stroke-width="5"/>
      <polygon points="100,85 90,65 110,65" fill="#8B0000"/>

      <line x1="42" y1="135" x2="75" y2="115" stroke="#8B0000" stroke-width="5"/>
      <polygon points="82,110 65,105 73,124" fill="#8B0000"/>

      <line x1="158" y1="135" x2="125" y2="115" stroke="#8B0000" stroke-width="5"/>
      <polygon points="118,110 135,105 127,124" fill="#8B0000"/>
    </g>
  </symbol>
</svg>

<!-- ЗАГРУЗКА -->
<div id="loader">
  <div class="loader-emblem">
    <svg style="color:#8B0000"><use href="#scp-logo"/></svg>
  </div>
  <div class="load-text" id="loadText"></div>
</div>

<!-- ВХОД -->
<div class="screen" id="login">
  <div class="login-emblem">
    <svg style="color:#8B0000"><use href="#scp-logo"/></svg>
  </div>
  <div class="login-title">SCP FOUNDATION</div>
  <div class="login-sub">ВВЕДИТЕ ИДЕНТИФИКАТОР</div>
  <input type="text" class="code-input" id="codeInput" placeholder="_ _ _ - _ _ - _ _ _" autocomplete="off">
  <button class="login-btn" onclick="checkCode()">ПОДТВЕРДИТЬ</button>
  <div class="error-msg" id="errorMsg"></div>
  <div class="login-footer">Исх. № 641\88-6 · ДСП</div>
</div>

<!-- ГЛАВНАЯ -->
<div class="screen" id="main">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-emblem"><svg style="color:#8B0000"><use href="#scp-logo"/></svg></div>
      <div class="topbar-title">SCP FOUNDATION<br>ЛИЧНЫЙ КАБИНЕТ</div>
    </div>
    <div class="topbar-status">● ДОПУСК: ОГРАНИЧЕН</div>
  </div>
  <div class="menu">
    <div class="menu-item" onclick="lowAccess()">АРХИВ <span class="arrow">→</span></div>
    <div class="menu-item" onclick="lowAccess()">ЛИЧНОЕ ДЕЛО <span class="arrow">→</span></div>
    <div class="menu-item" onclick="lowAccess()">СЕКТОР 82 <span class="arrow">→</span></div>
    <div class="menu-item" onclick="lowAccess()">СВЯЗЬ С КУРАТОРОМ <span class="arrow">→</span></div>
    <div class="menu-item protocol" onclick="openProtocol()">ПРОТОКОЛ ПРОВЕРКИ <span class="arrow">→</span></div>
  </div>
</div>

<!-- ПРОТОКОЛ -->
<div class="screen" id="protocol">
  <div class="protocol-head">
    <div class="protocol-emblem"><svg style="color:#8B0000"><use href="#scp-logo"/></svg></div>
    <div>
      <div class="protocol-header">РЕГЛАМЕНТ ДОПОЛНИТЕЛЬНЫХ ПРОВЕРОК</div>
      <div class="protocol-title">ПРОТОКОЛ</div>
    </div>
  </div>
  <div class="protocol-divider"></div>
  <div id="days"></div>
  <div class="back-link" onclick="backToMain()">← НАЗАД</div>
</div>

<!-- МОДАЛКА -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title" id="modalTitle">ДОСТУП ОГРАНИЧЕН</div>
    <div class="modal-text" id="modalText"></div>
    <button class="modal-btn" onclick="closeModal()">ПРИНЯТО</button>
  </div>
</div>

<script>
var VALID_CODES = ['619-33-012','844-01-902','038-02-048','028-99-539','394-39-002','381-39-289'];

var DAYS = [
  { num: 1, date: new Date(2025, 0, 1, 10, 0, 0),
    text: 'ДОБРО ПОЖАЛОВАТЬ, СТАЖЁР.\n\nВаша заявка была рассмотрена. Кандидатура согласована.\n\nВы приняты в штат Фонда. На текущем этапе Фонд не может в полной мере доверить вам информацию о местоположении Зоны 82.\n\nНеобходимые данные вы обязаны выявить самостоятельно.\n\nСколько человек в вашей группе?',
    anyAnswer: true },
  { num: 2, date: new Date(2025, 0, 2, 10, 0, 0),
    text: 'ПРОВЕРКА ВНИМАТЕЛЬНОСТИ.\n\nВ присланном вам документе есть номер: 641\\88-6.\n\nСложите все цифры этого номера.\n\nК полученному числу прибавьте количество человек в вашей группе.\n\nВведите результат.',
    calcAnswer: function(g) { return String(33 + g); } },
  { num: 3, date: new Date(2025, 0, 3, 10, 0, 0),
    text: 'Осталось последнее.\n\nВ вашем документе есть дата. Она не совпадает с датой сбора.\n\nВведите дату из документа в формате ДД.ММ.ГГГГ.',
    answer: '23.10.2026' },
  { num: 4, date: new Date(2025, 0, 4, 10, 0, 0),
    text: 'ПРОВЕРКА ЗАВЕРШЕНА.\n\nВы выдержали все этапы.\n\nФонд подтверждает ваш допуск.',
    isFinal: true }
];

var groupSize = 4;
var completedDays = {};
var openDays = {};

var loadLines = [
  '> ИНИЦИАЛИЗАЦИЯ СИСТЕМЫ...',
  '> ПРОВЕРКА СОЕДИНЕНИЯ...',
  '> ПОИСК ЗАЩИЩЁННОГО КАНАЛА...',
  '> <span>УСТАНОВЛЕНО.</span>',
  '> ЗАГРУЗКА ПРОТОКОЛА 641\\88-6...',
  '> <span>ДОСТУП К СИСТЕМЕ...</span>'
];

var loadIdx = 0;
var loadTextEl = document.getElementById('loadText');

function typeLine() {
  if (loadIdx >= loadLines.length) return;
  var line = loadLines[loadIdx];
  var cur = loadTextEl.innerHTML;
  loadTextEl.innerHTML = cur + (cur ? '<br>' : '') + line + '<span class="cursor"></span>';
  loadIdx++;
  setTimeout(typeLine, 400);
}

typeLine();

setTimeout(function() {
  document.getElementById('loader').style.opacity = '0';
  setTimeout(function() {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('login').classList.add('active');
  }, 800);
}, 3400);

function checkCode() {
  var val = document.getElementById('codeInput').value.trim();
  var err = document.getElementById('errorMsg');
  if (VALID_CODES.indexOf(val) !== -1) {
    err.textContent = '';
    document.getElementById('login').classList.remove('active');
    document.getElementById('main').classList.add('active');
    setTimeout(showFirstModal, 8000);
  } else {
    err.textContent = 'НЕВЕРНЫЙ ИДЕНТИФИКАТОР. ПОВТОРИТЕ ВВОД.';
    document.getElementById('codeInput').value = '';
  }
}

document.getElementById('codeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkCode();
});

function lowAccess() {
  document.getElementById('modalTitle').textContent = 'ДОСТУП ОГРАНИЧЕН';
  document.getElementById('modalText').textContent = 'Ваш уровень допуска недостаточен. Обратитесь к куратору.';
  document.getElementById('modalOverlay').classList.add('show');
}

function showFirstModal() {
  document.getElementById('modalTitle').textContent = 'УВЕДОМЛЕНИЕ';
  document.getElementById('modalText').innerHTML = 'Уважаемый стажёр.<br><br>Фонд ценит своё право оставаться в тени. Несмотря на то, что ваша заявка одобрена, регламент обязывает провести дополнительные проверки.<br><br>Процедура начнётся <span style="color:#8B0000">26.10 в 10:00</span>.<br>Возвращайтесь ежедневно.<br><br>Раздел <span style="color:#8B0000">«ПРОТОКОЛ ПРОВЕРКИ»</span> уже доступен.';
  document.getElementById('modalOverlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function openProtocol() {
  document.getElementById('main').classList.remove('active');
  document.getElementById('protocol').classList.add('active');
  renderDays();
  startTimers();
}

function backToMain() {
  document.getElementById('protocol').classList.remove('active');
  document.getElementById('main').classList.add('active');
}

function toggleDay(num) {
  var d = DAYS.find(function(x) { return x.num === num; });
  var now = new Date();
  if (now < d.date) return;
  openDays[num] = !openDays[num];
  renderDays();
}

function renderDays() {
  var container = document.getElementById('days');
  container.innerHTML = '';
  DAYS.forEach(function(d, i) {
    var now = new Date();
    var isOpen = now >= d.date;
    var isDone = completedDays[d.num];
    var prevDone = i === 0 ? true : completedDays[DAYS[i-1].num];
    var isExpanded = openDays[d.num];

    var statusClass, statusText;
    if (isDone) { statusClass = 'done'; statusText = 'ВЫПОЛНЕНО'; }
    else if (!prevDone) { statusClass = 'lock'; statusText = 'ЗАБЛОКИРОВАНО'; }
    else if (isOpen) { statusClass = 'wait'; statusText = 'НАЖМИТЕ'; }
    else { statusClass = 'wait'; statusText = 'ОЖИДАНИЕ'; }

    var el = document.createElement('div');
    el.className = 'day';
    if (isDone) el.classList.add('open');
    if (!isOpen || !prevDone) el.classList.add('locked');
    if (isOpen && prevDone && !isDone) el.classList.add('available');
    if (isExpanded) el.classList.add('open');

    el.innerHTML = '<div class="day-head" onclick="toggleDay(' + d.num + ')"><div class="day-num">ДЕНЬ ' + d.num + '</div><div class="day-status ' + statusClass + '">' + statusText + '</div></div>' +
      '<div class="day-timer" id="timer-' + d.num + '"></div>' +
      '<div class="day-body"><div class="day-text">' + d.text + '</div>' + renderDayInput(d) + '<div class="day-result" id="result-' + d.num + '"></div></div>';
    container.appendChild(el);
  });
}

function renderDayInput(d) {
  if (d.isFinal) {
    return '<div class="final-message"><div style="color:#777;font-size:11px;letter-spacing:3px;">ДОПУСК ПОДТВЕРЖДЁН</div><div class="big">30.10 · 17:20</div><div style="color:#777;font-size:11px;letter-spacing:3px;">ЯВКА ОБЯЗАТЕЛЬНА</div></div>';
  }
  return '<input type="text" class="day-code-input" id="input-' + d.num + '" placeholder="ВВЕДИТЕ ОТВЕТ">' +
    '<button class="day-btn" onclick="submitDay(' + d.num + ')">ПОДТВЕРДИТЬ</button>';
}

function submitDay(num) {
  var d = DAYS.find(function(x) { return x.num === num; });
  var val = document.getElementById('input-' + num).value.trim();
  var res = document.getElementById('result-' + num);

  if (d.anyAnswer) {
    if (val.length === 0) { res.className = 'day-result err'; res.textContent = 'ВВЕДИТЕ ОТВЕТ.'; return; }
    var size = parseInt(val);
    if (!isNaN(size) && size > 0 && size < 50) groupSize = size;
    completedDays[num] = true;
    res.className = 'day-result ok';
    res.textContent = 'ПРИНЯТО.';
    setTimeout(renderDays, 600);
    return;
  }
  if (d.calcAnswer) {
    if (val === d.calcAnswer(groupSize)) {
      completedDays[num] = true;
      res.className = 'day-result ok';
      res.textContent = 'ВЕРНО.';
      setTimeout(renderDays, 600);
    } else { res.className = 'day-result err'; res.textContent = 'НЕВЕРНО.'; }
    return;
  }
  if (d.answer) {
    if (val === d.answer) {
      completedDays[num] = true;
      res.className = 'day-result ok';
      res.textContent = 'ВЕРНО.';
      setTimeout(renderDays, 600);
    } else { res.className = 'day-result err'; res.textContent = 'НЕВЕРНО.'; }
  }
}

var timerInterval = null;
function startTimers() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimers, 1000);
  updateTimers();
}

function updateTimers() {
  var now = new Date();
  DAYS.forEach(function(d) {
    var el = document.getElementById('timer-' + d.num);
    if (!el) return;
    if (completedDays[d.num]) { el.textContent = ''; return; }
    if (now >= d.date) { el.textContent = 'ДЕНЬ ДОСТУПЕН'; return; }
    var diff = d.date - now;
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);
    el.textContent = 'ОТКРЫТИЕ ЧЕРЕЗ: ' + days + 'д ' + hours + 'ч ' + mins + 'м ' + secs + 'с';
  });
}
</script>
